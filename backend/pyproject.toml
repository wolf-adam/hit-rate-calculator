[project]
name = "hit-rate-calculator-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
	"fastapi>=0.115,<1",
	"pandas>=2.2,<3",
	"psycopg[binary]>=3.2,<4",
	"pydantic-settings>=2.6,<3",
	"pyjwt[crypto]>=2.9,<3",
	"python-dotenv>=1.0,<2",
	"sqlalchemy>=2.0,<3",
	"uvicorn[standard]>=0.34,<1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
